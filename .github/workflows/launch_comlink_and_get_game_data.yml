name: Run swgoh-comlink container and query API /data endpoint for units collection

on:
  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  run-container-and-query:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant write permission for the GITHUB_TOKEN to push changes

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Create data directory # This creates the directory locally if it doesn't exist
      run: mkdir -p data

    - name: Get current date and unique ID
      id: date_id_step
      run: |
        echo "DATE_STRING=$(date +%Y-%m-%d)" >> $GITHUB_ENV
        echo "UNIQUE_ID=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 8)" >> $GITHUB_ENV
      # This sets environment variables DATE_STRING (YYYY-MM-DD) and UNIQUE_ID (8-char alphanumeric)

    - name: Run swgoh-comlink container
      id: run-container
      run: |
        docker run -d --rm --name swgoh-comlink -p 3200:3000 --env APP_NAME=gh-action-comlink ghcr.io/swgoh-utils/swgoh-comlink:latest

    - name: Wait for comlink to accept requests
      # A fixed sleep let a slow start surface as a /data failure that looked like
      # an upstream outage. Poll instead, and fail loudly if the container never
      # comes up.
      run: |
        for i in $(seq 1 30); do
          if curl -sf -X POST -H 'Content-Type: application/json' -d '{}' \
               http://localhost:3200/metadata >/dev/null; then
            echo "comlink ready after ${i} attempt(s)"
            exit 0
          fi
          sleep 2
        done
        echo "comlink did not become ready within 60s" >&2
        docker logs swgoh-comlink >&2 || true
        exit 1

    - name: Get game metadata
      # jq prints the string `null` for a missing key, which is non-empty and so
      # slips past the fetch script's own guard. An unguarded null version reaches
      # EA as a malformed request and comes back as an upstream no-response —
      # indistinguishable from a real outage. Assert a usable version here instead.
      run: |
        MD_VERSION=$(curl -sS -X POST -H 'Content-Type: application/json' -d '{}' \
          http://localhost:3200/metadata | jq '.latestGamedataVersion')
        if [ -z "$MD_VERSION" ] || [ "$MD_VERSION" = "null" ] || [ "$MD_VERSION" = '""' ]; then
          echo "/metadata returned no usable latestGamedataVersion (got: ${MD_VERSION:-<empty>})" >&2
          exit 1
        fi
        echo "MD_VERSION=$MD_VERSION" >> $GITHUB_ENV

    - name: Fetch units collection from /data
      # Delegates to the shared fetch script so this workflow gets the same status
      # checking, response validation and retry behaviour as the scheduled run.
      env:
        FILE_PREFIX: units_response
        UNITS_ITEM: '137438953472'
      run: |
        chmod +x scripts/fetch_data_items.sh
        printf '%s\n' "$UNITS_ITEM" > "$RUNNER_TEMP/units_item.txt"
        scripts/fetch_data_items.sh "$RUNNER_TEMP/units_item.txt"

    - name: Commit and push response # This action will create the 'data' folder in the repo if it's new
      uses: EndBug/add-and-commit@v11
      with:
        add: 'data/units_response_${{ env.DATE_STRING }}_*_${{ env.UNIQUE_ID }}.json'
        message: 'feat: Add SWGOH /data units collection response for ${{ env.DATE_STRING }} (ID: ${{ env.UNIQUE_ID }})'
